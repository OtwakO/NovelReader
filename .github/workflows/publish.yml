name: Verify and publish containers

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/publish.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'webview-worker/**'
      - 'build/**'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-bake.hcl'
      - 'docker-entrypoint.sh'
      - 'docker-compose.yml'
      - 'compose.e2e.yaml'
      - 'docker-e2e.sh'
      - 'testdata/docker/**'
      # Documentation inside watched source trees does not require a release.
      - '!backend/**/*.md'
      - '!frontend/**/*.md'
      - '!webview-worker/**/*.md'
  workflow_dispatch:
    inputs:
      publish:
        description: Promote verified images to public tags (otherwise stage and verify only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  # One release owns both architecture builds through final pair promotion.
  group: novelreader-container-publication
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/otwako/novelreader
  WORKER_IMAGE: ghcr.io/otwako/novelreader-webview

jobs:
  backend:
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify clean-checkout backend
        working-directory: backend
        run: |
          test ! -e ../test-booksources
          go test ./...
          go test -race ./internal/api ./internal/book ./internal/fingerprint ./internal/sourceexec
          go build ./cmd/server ./cmd/conformance

  frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: node
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, test, and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build

  webview:
    name: Verify WebView worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.8'
          enable-cache: true
          cache-dependency-glob: webview-worker/uv.lock
      - name: Test WebView worker
        working-directory: webview-worker
        run: |
          uv python install
          uv sync --frozen
          uv run --frozen --no-sync patchright install chrome --with-deps
          uv run --frozen --no-sync python -m unittest discover -s . -p 'test_*.py'
          uv run --frozen --no-sync python -m py_compile browser.py worker.py
          uv run --frozen --no-sync python -c "import patchright; print('Patchright import passed')"

  containers:
    name: Verify images (${{ matrix.arch }})
    needs: [backend, frontend, webview]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f compose.e2e.yaml --profile webview --profile e2e config --quiet

      - name: Build app and WebView images concurrently
        env:
          PLATFORM: linux/${{ matrix.arch }}
          CACHE_ARCH: ${{ matrix.arch }}
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          files: docker-bake.hcl
          targets: |
            app
            worker
          set: |
            *.labels.org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify native image architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          for image in novelreader:e2e novelreader-webview:e2e; do
            test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = "linux/$EXPECTED_ARCH"
          done

      - name: Verify WebView image in both modes
        run: |
          docker run --rm novelreader-webview:e2e /app/.venv/bin/python -c "from runtime import runtime_metadata; print(runtime_metadata())"
          tests=$(mktemp -d)
          trap 'rm -rf "$tests"' EXIT
          cp webview-worker/test_*.py "$tests/"
          chmod -R a+rX "$tests"
          for mode in headless headful; do
            docker run --rm --shm-size=512m \
              -e WEBVIEW_BROWSER_MODE="$mode" -e PYTHONPATH=/app \
              -v "$tests:/tests:ro" \
              novelreader-webview:e2e /app/.venv/bin/python \
              -m unittest discover -s /tests -p 'test_*.py' -q
          done

      - name: Verify exact release images with Compose
        env:
          E2E_SKIP_BUILD: '1'
          NOVELREADER_IMAGE: novelreader:e2e
          NOVELREADER_WEBVIEW_IMAGE: novelreader-webview:e2e
        run: ./docker-e2e.sh

      - name: Stage verified image digests
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          staging_tag="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"

          stage_local() {
            local source=$1 repository=$2
            local target="$repository:$staging_tag"
            docker tag "$source" "$target"
            docker push "$target" >/dev/null
            docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}'
          }

          mkdir -p digests
          stage_local novelreader:e2e "$APP_IMAGE" > "digests/$ARCH-app" &
          app_pid=$!
          stage_local novelreader-webview:e2e "$WORKER_IMAGE" > "digests/$ARCH-worker" &
          worker_pid=$!

          # Drain both uploads even if one fails; never promote a partial pair.
          status=0
          wait "$app_pid" || status=1
          wait "$worker_pid" || status=1
          if [[ "$status" != 0 ]]; then
            exit "$status"
          fi

      - name: Save verified architecture digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Assemble and publish multi-platform pair
    needs: [containers]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test publication gates
        run: python3 -m unittest discover -s build -p 'test_*.py' -q
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download verified architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digests-*
          path: digests
          merge-multiple: true
      - name: Assemble verified indexes and optionally promote
        env:
          PUBLISH_IMAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: bash build/publish-images.sh digests
