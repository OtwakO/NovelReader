<!doctype html>
<!-- DISPOSABLE: compare three Continue Reading layouts with synthetic data. No application wiring. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continue Reading — disposable prototypes</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../src/ui/styles/tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#e7e8e8;color:var(--color-ink);font:16px/1.5 var(--font-ui)}
.tools{padding:20px;max-width:1000px;margin:auto}h1{font-size:22px;margin:0 0 6px}p{margin:0 0 16px}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center}label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}select,button{font:inherit;min-height:44px;border:1px solid #929b9f;border-radius:8px;padding:8px 12px;background:white;color:var(--color-ink)}input{accent-color:var(--color-accent)}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--color-accent);outline-offset:3px}.stage{padding:0 12px 110px;display:flex;justify-content:center}iframe{width:390px;max-width:100%;height:1050px;border:1px solid #a9afb1;background:var(--color-paper)}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:#24333a;color:white;box-shadow:0 6px 20px #0003}.switcher span{font-size:14px;text-align:center;max-width:230px}.switcher button{flex:none}#description{margin-top:16px}small{color:var(--color-ink-muted)}
</style>
</head>
<body>
<header class="tools">
<h1>Continue Reading: layout comparison</h1>
<p>Disposable prototypes · synthetic books · existing artwork and palette · no data is saved.</p>
<div class="controls">
<label>Preview width <select id="width"><option>320</option><option selected>390</option><option>430</option><option>550</option><option>768</option><option>1100</option></select> px</label>
<label>Content <select id="content"><option value="normal">Typical title</option><option value="long">Long title & chapter</option><option value="zh">繁體中文 · 長標題</option></select></label>
</div>
<p id="description"></p><small id="state"></small>
</header>
<main class="stage"><iframe id="preview" title="Bookshelf layout prototype"></iframe></main>
<nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><span id="variant" aria-live="polite"></span><button id="next" aria-label="Next variant">→</button></nav>
<script>
const variants = [
 {key:'A',name:'Compact side-by-side',description:'Small cover beside all information and actions. Closest to the current component; note how long text makes the right column taller.'},
 {key:'B',name:'Full-width reading context',description:'Cover and identity form one row. Current chapter, progress and actions use the full width below. Recommended starting point for narrow screens.'},
 {key:'C',name:'Dedicated action footer',description:'Cover beside identity and current chapter. Progress and actions sit in a separate full-width footer, keeping the reading action easy to locate.'}
];
const samples={normal:{title:'The Lantern Keeper',author:'Mira Chen',chapter:'The road beyond the harbour'},long:{title:'The Lantern Keeper and the Secret of the Forgotten Northern Kingdom',author:'Alexandra Montgomery',chapter:'Across the winter sea, where the last lighthouse still remembers our names'},zh:{title:'長夜行舟：在世界盡頭尋找最後一盞燈的人',author:'林間聽雨',chapter:'第十二章　越過冬日海岸，尋找記憶裡未曾熄滅的燈火'}};
const params=new URLSearchParams(location.search);
let index=Math.max(0,variants.findIndex(v=>v.key===params.get('variant')));
const width=document.querySelector('#width'),content=document.querySelector('#content'),frame=document.querySelector('#preview');
const cover='../../src/assets/covers/default-book-cover.webp';
function render(){
 const v=variants[index],s=samples[content.value],zh=content.value==='zh';
 params.set('variant',v.key);history.replaceState(null,'','?'+params);
 document.querySelector('#variant').textContent=v.key+' · '+v.name;
 document.querySelector('#description').textContent=v.description;
 document.querySelector('#state').textContent=`Variant ${v.key} · requested viewport ${width.value}px (capped to your window) · ${content.options[content.selectedIndex].text} · preview buttons are inert`;
 frame.style.width=width.value+'px';
 const identity=`<div class="identity"><h3>${s.title}</h3><p>${s.author}</p><span class="count">${zh?'第 12 / 80 章':'Chapter 12 of 80'}</span></div>`;
 const image=`<img class="cover" src="${cover}" alt="Sample book cover">`;
 const chapter=`<div class="chapter"><span>${zh?'目前章節':'Current chapter'}</span><strong>${s.chapter}</strong></div>`;
 const progress='<div class="track" role="progressbar" aria-label="Reading progress" aria-valuenow="15" aria-valuemin="0" aria-valuemax="100"><span></span></div>';
 const actions=`<div class="actions"><button class="app-button app-button--primary" type="button"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v15M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Z"/></svg>${zh?'繼續閱讀':'Continue reading'}</button><button class="app-button app-button--secondary" type="button">${zh?'書籍詳情':'Details'}</button></div>`;
 let panel=v.key==='A'?`${image}<div class="copy">${identity}${chapter}${progress}${actions}</div>`:v.key==='B'?`<div class="book-row">${image}${identity}</div><div class="reading">${chapter}${progress}${actions}</div>`:`<div class="book-row">${image}<div class="copy">${identity}${chapter}</div></div><div class="footer">${progress}${actions}</div>`;
 frame.srcdoc=`<!doctype html><html lang="${zh?'zh-Hant':'en'}"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../src/ui/styles/tokens.css"><link rel="stylesheet" href="../../src/ui/styles/controls.css"><style>
 *{box-sizing:border-box}body{margin:0;background:var(--color-paper);color:var(--color-ink);font:16px/1.5 var(--font-ui)}.shell{padding:16px 20px;border-bottom:1px solid var(--color-border);display:flex;justify-content:space-between;gap:12px;font-size:14px}.shell strong{font-size:18px}main{padding:24px 16px;max-width:1100px;margin:auto}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:26px;margin:0}.intro{color:var(--color-ink-muted);font-size:14px;margin:8px 0 28px}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h2{font-size:20px;margin:0}.section-heading span{color:var(--color-ink-muted);font-size:14px}.panel{padding:18px;border:1px solid color-mix(in srgb,var(--color-warm) 34%,var(--color-border));border-radius:16px;background:color-mix(in srgb,var(--color-paper-raised) 82%,var(--color-accent-soft));box-shadow:var(--shadow-card)}.cover{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;align-self:start;box-shadow:0 6px 12px #36271a20}.identity,.copy,.reading{min-width:0}h3{font-size:18px;font-weight:600;line-height:1.35;margin:0;overflow-wrap:anywhere}.identity p{font-size:14px;color:var(--color-ink-muted);margin:6px 0}.count{font-size:13px;color:var(--color-ink-muted);font-variant-numeric:tabular-nums}.chapter{display:grid;gap:4px;margin:18px 0 12px;overflow-wrap:anywhere}.chapter>span{font-size:13px;color:var(--color-warm);font-weight:600}.chapter strong{font-size:16px;line-height:1.45;font-weight:600}.track{height:5px;background:var(--color-paper-muted);border-radius:8px;overflow:hidden}.track span{display:block;height:100%;width:15%;background:var(--color-warm)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.actions .app-button--primary{flex:1 1 145px}.actions .app-button--secondary{flex:0 1 auto}.actions svg{flex:none}.book-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px}.A{display:grid;grid-template-columns:clamp(64px,19vw,96px) minmax(0,1fr);gap:14px}.A .actions .app-button{flex:1 1 100%}.B .chapter{margin-top:20px}.C{padding:0;overflow:hidden}.C .book-row{padding:18px}.C .chapter{margin-bottom:0}.C .footer{padding:16px 18px 18px;background:var(--color-paper-raised);border-top:1px solid var(--color-border)}.shelf{margin-top:32px}.shelf p{font-size:14px;color:var(--color-ink-muted);margin:4px 0 16px}.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.books img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--color-paper-muted)}.books strong{font-size:14px;display:block;margin-top:8px}.books span{font-size:13px;color:var(--color-ink-muted)}
 @media(min-width:600px){main{padding:32px}.panel{padding:24px}.A{grid-template-columns:150px minmax(0,1fr);gap:24px}.A .actions .app-button{flex:0 1 auto}.book-row{grid-template-columns:120px minmax(0,1fr);gap:24px}.B{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}.B .chapter{margin-top:0}.C{padding:0}.C .book-row{padding:24px}.C .footer{padding:18px 24px}.books{grid-template-columns:repeat(3,140px)}}
 @media(max-width:350px){.book-row{grid-template-columns:72px minmax(0,1fr);gap:12px}.panel{padding:14px}.C{padding:0}.C .book-row{padding:14px}.actions .app-button--secondary{flex:1 1 70px}.books{gap:10px}}
 </style></head><body><header class="shell"><strong>NovelReader</strong><span>${zh?'書架 · 設定':'Shelf · Settings'}</span></header><main><div class="page-heading"><h1>${zh?'書架':'Bookshelf'}</h1><button type="button" class="app-button app-button--secondary">${zh?'本地匯入':'Local import'}</button></div><p class="intro">${zh?'你的藏書，隨時接續閱讀。':'Your books, ready when you are.'}</p><section><div class="section-heading"><h2>${zh?'繼續閱讀':'Continue reading'}</h2><span>15%</span></div><div class="panel ${v.key}">${panel}</div></section><section class="shelf"><h2>${zh?'我的書籍':'Your books'}</h2><p>${zh?'3 本書 · 示範內容':'3 books · sample content'}</p><div class="books">${['The Lantern Keeper','A Quiet Journey','Beyond the Shore'].map(title=>`<div><img src="${cover}" alt=""><strong>${title}</strong><span>Sample author</span></div>`).join('')}</div></section></main></body></html>`;
}
function cycle(step){index=(index+step+variants.length)%variants.length;render()}
document.querySelector('#previous').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);width.onchange=render;content.onchange=render;
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1)}});
render();
</script>
</body>
</html>
