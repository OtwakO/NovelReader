<!doctype html>
<!-- DISPOSABLE: compare bookshelf browsing layouts. Synthetic data; no app wiring or mutations. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookshelf cards — disposable prototypes</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../../src/ui/styles/tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#e7e8e8;color:var(--color-ink);font:16px/1.5 var(--font-ui)}.tools{max-width:1100px;margin:auto;padding:20px}h1{margin:0 0 6px;font-size:22px}p{margin:0 0 16px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px}label{display:flex;flex-wrap:wrap;align-items:center;gap:8px}select,button{font:inherit;min-height:44px;padding:8px 12px;background:white;color:var(--color-ink);border:1px solid #929b9f;border-radius:8px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--color-accent);outline-offset:3px}.description{margin:16px 0 8px}small{color:var(--color-ink-muted)}.stage{padding:0 12px 110px;display:flex;justify-content:center}iframe{width:390px;max-width:100%;height:1650px;background:var(--color-paper);border:1px solid #a9afb1}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);width:max-content;display:flex;gap:12px;align-items:center;padding:8px;background:#24333a;color:white;border-radius:12px;box-shadow:0 6px 20px #0003}.switcher span{max-width:230px;text-align:center;font-size:14px}.switcher button{flex:none}
</style></head><body>
<header class="tools"><h1>Bookshelf: three ways to browse</h1><p>Disposable prototypes · synthetic books · existing artwork, colors and typography · no saved state.</p><div class="controls"><label>Preview width <select id="width"><option>320</option><option selected>390</option><option>550</option><option>768</option><option>1280</option></select> px</label><label>Content <select id="content"><option value="en">English · mixed title lengths</option><option value="zh">繁體中文 · 長標題</option></select></label></div><p class="description" id="description"></p><small id="state"></small></header>
<main class="stage"><iframe id="preview" title="Bookshelf card layout preview"></iframe></main><nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><span id="variant" aria-live="polite"></span><button id="next" aria-label="Next variant">→</button></nav>
<script>
const variants=[
 {key:'A',name:'Cover gallery',description:'Artwork leads. Two columns on phones; calm metadata and a full-width reading action. Latest chapter appears on wider screens. Best for recognizing books visually.'},
 {key:'B',name:'Compact reading cards',description:'Cover and identity side by side, current chapter beneath the title, then a full-width progress/action footer. More title space without losing the visual shelf.'},
 {key:'C',name:'Reading list',description:'One continuous list with small covers, wide titles and a clear reading action. Most efficient for scanning long titles; latest chapters appear when there is room.'}
];
const en=[
 ['The Lantern Keeper','Mira Chen','The road beyond the harbour','A light in the northern sky',12,80,15],
 ['A Quiet Journey Through the Cities We Left Behind','Alexandra Montgomery','The station where nobody waits','Letters from the old country',38,120,32],
 ['Beyond the Shore','Theo Rivers','The first crossing','The tide returns',0,64,0],
 ['The Atlas of Forgotten Places and the People Who Remember Them','Jun Park','A city without a name','The last mapmaker',96,100,96]
];
const chineseBooks=[
 ['長夜行舟：在世界盡頭尋找最後一盞燈的人','林間聽雨','越過冬日海岸，尋找記憶裡未曾熄滅的燈火','北方天空的微光',12,80,15],
 ['那些年，我們一起走過的無名城市與漫長旅途','陳以安','無人等候的車站','來自故鄉的信',38,120,32],
 ['海岸之外','江望','第一次渡海','潮水歸來的時候',0,64,0],
 ['被遺忘之地的地圖，以及仍然記得它們的人','周遠山','沒有名字的城市','最後一位製圖師',96,100,96]
];
const cover='../../src/assets/covers/default-book-cover.webp';
const params=new URLSearchParams(location.search);let index=Math.max(0,variants.findIndex(v=>v.key===params.get('variant')));
const width=document.querySelector('#width'),content=document.querySelector('#content'),frame=document.querySelector('#preview');
function render(){
 const variant=variants[index],zh=content.value==='zh',books=zh?chineseBooks:en;
 params.set('variant',variant.key);history.replaceState(null,'','?'+params);
 document.querySelector('#variant').textContent=variant.key+' · '+variant.name;
 document.querySelector('#description').textContent=variant.description;
 document.querySelector('#state').textContent=`Variant ${variant.key} · ${width.value}px requested (capped to window) · ${zh?'Traditional Chinese':'English'} · 4 books including unread · navigation/actions are inert`;
 frame.style.width=width.value+'px';
 const cards=books.map((b,i)=>{
 const image=`<img class="cover" src="${cover}" alt="">`;
 const identity=`<div class="identity"><h3><a href="#" onclick="return false">${b[0]}</a></h3><p class="author">${b[1]}</p></div>`;
 const chapter=`<div class="chapter"><span>${b[4]===0?(zh?'尚未開始':'Not started'):(zh?'目前章節':'Current chapter')}</span><strong>${b[2]}</strong></div>`;
 const latest=`<p class="latest"><span>${zh?'最新':'Latest'}</span> ${b[3]}</p>`;
 const progress=`<div class="progress"><div class="numbers"><span>${b[4]===0?(zh?'尚未閱讀':'Unread'):(zh?'第 '+b[4]+' / '+b[5]+' 章':'Ch. '+b[4]+' / '+b[5])}</span><span>${b[6]}%</span></div><div class="track" role="progressbar" aria-label="${zh?'閱讀進度':'Reading progress'}" aria-valuenow="${b[6]}" aria-valuemin="0" aria-valuemax="100"><span style="width:${b[6]}%"></span></div></div>`;
 const action=`<button class="app-button app-button--secondary" type="button" aria-label="${b[4]===0?'Read':'Resume'} ${b[0]}"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v15M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Z"/></svg>${b[4]===0?(zh?'開始閱讀':'Read'):(zh?'繼續閱讀':'Resume')}</button>`;
 return variant.key==='A'?`<article class="book">${image}<div class="copy">${identity}${chapter}${latest}</div><footer>${progress}${action}</footer></article>`:variant.key==='B'?`<article class="book"><div class="book-top">${image}<div class="copy">${identity}${chapter}</div></div>${latest}<footer>${progress}${action}</footer></article>`:`<article class="book">${image}<div class="copy">${identity}${chapter}${latest}</div><footer>${progress}${action}</footer></article>`;
 }).join('');
 frame.srcdoc=`<!doctype html><html lang="${zh?'zh-Hant':'en'}"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../src/ui/styles/tokens.css"><link rel="stylesheet" href="../../src/ui/styles/controls.css"><style>
 *{box-sizing:border-box}body{margin:0;background:var(--color-paper);color:var(--color-ink);font:16px/1.5 var(--font-ui)}.shell{display:flex;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--color-border);font-size:14px}.shell strong{font-size:18px}main{max-width:1100px;padding:24px 16px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:26px;margin:0}h2{font-size:20px;margin:0}main>p{font-size:14px;color:var(--color-ink-muted);margin:8px 0 24px}.resume-context{padding:16px;background:var(--color-paper-raised);border:1px solid var(--color-border);border-radius:16px;margin:0 0 28px}.resume-context p{margin:4px 0 12px;font-size:14px;color:var(--color-ink-muted)}.resume-context strong{display:block;font-size:16px;margin-top:12px}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-heading>span{font-size:14px;color:var(--color-ink-muted)}.tools{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}.tools input,.tools select{min-height:44px;border:1px solid var(--color-border);border-radius:12px;background:var(--color-paper-raised);padding:10px;font:inherit;color:var(--color-ink);min-width:0;max-width:100%}.tools input{flex:1 1 140px}.tools select{flex:1 1 140px}.cover{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--color-paper-muted);display:block}.copy,.identity,.progress{min-width:0}h3{margin:0;font-size:18px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}h3 a{color:inherit;text-decoration:none}h3 a:hover{text-decoration:underline}a:focus-visible{outline:2px solid var(--color-accent);outline-offset:3px}.author{margin:4px 0 0;font-size:14px;color:var(--color-ink-muted);overflow-wrap:anywhere}.chapter{margin-top:14px;display:grid;gap:3px;min-width:0}.chapter>span{font-size:13px;color:var(--color-warm)}.chapter strong{font-size:14px;line-height:1.5;font-weight:400;overflow-wrap:anywhere}.latest{font-size:13px;color:var(--color-ink-muted);margin:12px 0 0;overflow-wrap:anywhere}.latest span{font-weight:600}.numbers{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--color-ink-muted);font-variant-numeric:tabular-nums;margin-bottom:6px}.track{height:4px;border-radius:6px;overflow:hidden;background:var(--color-paper-muted)}.track>span{display:block;height:100%;background:var(--color-warm)}footer{display:grid;gap:12px}.app-button svg{flex:none}.books{display:grid;gap:16px}.book{min-width:0}
 .A{grid-template-columns:repeat(2,minmax(0,1fr))}.A .book{display:flex;flex-direction:column}.A .cover{box-shadow:0 6px 14px #36271a1c}.A .copy{padding:12px 0}.A h3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.A .author{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.A .chapter strong{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.A footer{margin-top:auto}.A .latest{display:none}
 .B .book{display:flex;flex-direction:column;padding:16px;border:1px solid var(--color-border);border-radius:16px;background:var(--color-paper-raised)}.B .book-top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px}.B .cover{box-shadow:0 4px 10px #36271a17}.B footer{grid-template-columns:minmax(0,1fr) auto;align-items:center;margin-top:auto;padding-top:18px}.B .latest{display:none}
 .C{gap:0}.C .book{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px 16px;padding:20px 0;border-top:1px solid var(--color-border)}.C .book:first-child{padding-top:0;border-top:0}.C footer{grid-column:2;grid-template-columns:minmax(0,1fr) auto;align-items:center}.C .chapter{margin-top:10px}.C .latest{display:none}
 @media(min-width:600px){main{padding:32px}.A{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.A .latest,.B .latest,.C .latest{display:block}.C .book{grid-template-columns:80px minmax(0,1fr) 180px;gap:24px}.C footer{grid-column:3;grid-row:1;align-self:center;grid-template-columns:1fr}.C h3{max-width:38ch}.C .chapter strong{font-size:16px}}
 @media(min-width:900px){.A{grid-template-columns:repeat(4,minmax(0,1fr))}.B{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.B .book-top{grid-template-columns:96px minmax(0,1fr)}.B footer{padding-top:24px}}
 @media(max-width:350px){.A{gap:12px}.A h3{font-size:16px}.B .book{padding:14px}.B .book-top{grid-template-columns:68px minmax(0,1fr);gap:12px}.C .book{grid-template-columns:56px minmax(0,1fr);gap:12px}.C footer{grid-column:1/-1}}
 </style></head><body><header class="shell"><strong>NovelReader</strong><span>${zh?'書架 · 設定':'Shelf · Settings'}</span></header><main><div class="heading"><h1>${zh?'我的書架':'My shelf'}</h1><button type="button" class="app-button app-button--secondary">${zh?'本地匯入':'Local import'}</button></div><p>${zh?'整理藏書，隨時接續閱讀。':'Organize your books and return to where you stopped.'}</p><aside class="resume-context"><h2>${zh?'繼續閱讀':'Continue reading'}</h2><strong>${books[0][0]}</strong><p>${books[0][2]}</p><button type="button" class="app-button app-button--primary">${zh?'繼續閱讀':'Continue reading'}</button></aside><section><div class="section-heading"><h2>${zh?'我的藏書':'Your library'}</h2><span>${zh?'4 本書':'4 books'}</span></div><div class="tools"><input aria-label="${zh?'篩選藏書':'Filter library'}" placeholder="${zh?'搜尋書名或作者':'Filter by title or author'}" readonly><select aria-label="${zh?'排序':'Sort'}"><option>${zh?'最近閱讀':'Recently read'}</option></select></div><div class="books ${variant.key}">${cards}</div></section></main></body></html>`;
}
function cycle(step){index=(index+step+variants.length)%variants.length;render()}
document.querySelector('#previous').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);width.onchange=render;content.onchange=render;
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1)}});render();
</script></body></html>
