<!doctype html>
<!-- DISPOSABLE: three unified TXT/EPUB preview layouts. Synthetic content; no app wiring. -->
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Import preview — disposable comparisons</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../src/ui/styles/tokens.css">
  <link rel="stylesheet" href="../../src/ui/styles/controls.css">
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <header class="tools">
    <h1>Import preview: layout comparisons</h1>
    <p>Disposable mock · synthetic text and existing placeholder artwork · nothing is saved.</p>
    <div class="controls">
      <label>Width <select id="width"><option value="390">Mobile · 390 px</option><option value="768">Tablet · 768 px</option><option value="1100" selected>Desktop · 1100 px</option></select></label>
      <label>Format <select id="format"><option>EPUB</option><option>TXT</option></select></label>
      <label>Workflow <select id="workflow"><option value="import">Import review</option><option value="reparse">TXT re-analysis</option></select></label>
    </div>
    <p id="description"></p><small id="state" aria-live="polite"></small>
  </header>
  <main id="stage" class="stage"><div id="app"></div></main>
  <nav class="switcher" aria-label="Prototype variants">
    <button id="previous-variant" aria-label="Previous variant">←</button>
    <span id="variant" aria-live="polite"></span>
    <button id="next-variant" aria-label="Next variant">→</button>
  </nav>
  <script src="prototype.js"></script>
</body>
</html>
